version: "1.0.0"
title: "PostgreSQL K8s Setup"
description: |
  Deploy PostgreSQL on Kubernetes via Bitnami Helm chart. Run database
  migrations, verify readiness, and manage PostgreSQL infrastructure with
  Minikube-friendly resource limits.

instructions: |
  You are a PostgreSQL infrastructure expert. Deploy and manage PostgreSQL on
  Kubernetes using Bitnami Helm charts.

  Available actions:

  **Deploy PostgreSQL:**
  ```
  bash {{ recipe_dir }}/../.claude/skills/postgres-k8s-setup/scripts/deploy.sh --namespace {{ namespace }} --database {{ database }} --password {{ password }}
  ```

  **Verify Deployment:**
  ```
  python {{ recipe_dir }}/../.claude/skills/postgres-k8s-setup/scripts/verify.py --namespace {{ namespace }}
  ```

  **Run Migrations:**
  ```
  python {{ recipe_dir }}/../.claude/skills/postgres-k8s-setup/scripts/migrate.py --sql-dir {{ sql_dir }} --namespace {{ namespace }}
  ```

  Execution order: deploy → verify → migrate (if sql_dir provided).

  Rules:
  - Always add bitnami repo before install: helm repo add bitnami https://charts.bitnami.com/bitnami
  - Use --wait to ensure pods are ready before returning
  - Verify all pods are Running before running migrations
  - Use resource-constrained settings for Minikube (persistence.size=2Gi)
  - Run migration .sql files in alphabetical order for deterministic ordering
  - Never hardcode database passwords in scripts

parameters:
  - key: action
    input_type: select
    requirement: required
    description: "What PostgreSQL operation to perform"
    options:
      - "deploy"
      - "verify"
      - "migrate"
      - "deploy-and-migrate"
  - key: namespace
    input_type: string
    requirement: optional
    description: "Kubernetes namespace for PostgreSQL"
    default: "postgres"
  - key: database
    input_type: string
    requirement: optional
    description: "Database name to create"
    default: "appdb"
  - key: password
    input_type: string
    requirement: optional
    description: "PostgreSQL password (auto-generated if empty)"
    default: ""
  - key: sql_dir
    input_type: string
    requirement: optional
    description: "Path to directory containing .sql migration files"
    default: ""

extensions:
  - type: builtin
    name: developer
