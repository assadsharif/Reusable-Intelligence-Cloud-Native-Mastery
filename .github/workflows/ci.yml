name: CI/CD Pipeline

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install black ruff

      - name: Check code formatting with black
        run: black --check src/ --exclude 'src/mcp_servers/(nextjs_app_router_mcp|web_artifacts_mcp)\.py'

      - name: Lint with ruff
        run: ruff check src/ || true

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" || pip install -e "." || echo "No installable package found"

      - name: Run tests
        run: |
          if [ -d "tests" ]; then
            pip install pytest pytest-cov
            pytest tests/ -v --tb=short
          else
            echo "No tests/ directory found — skipping tests"
          fi

  validate-skills:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate skill structure
        run: |
          echo "=== Validating Skills ==="
          ERRORS=0
          for skill_dir in .claude/skills/*/; do
            skill_name=$(basename "$skill_dir")
            if [ ! -f "$skill_dir/SKILL.md" ]; then
              echo "❌ $skill_name: Missing SKILL.md"
              ERRORS=$((ERRORS + 1))
            else
              lines=$(wc -l < "$skill_dir/SKILL.md")
              if [ "$lines" -gt 500 ]; then
                echo "❌ $skill_name: SKILL.md too long ($lines lines > 500)"
                ERRORS=$((ERRORS + 1))
              else
                echo "✅ $skill_name: SKILL.md ($lines lines)"
              fi
            fi
          done
          echo ""
          echo "Skills checked: $(ls -d .claude/skills/*/ | wc -l)"
          if [ "$ERRORS" -gt 0 ]; then
            echo "❌ $ERRORS skill(s) have issues"
            exit 1
          else
            echo "✅ All skills valid"
          fi

  validate-scripts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate Python scripts syntax
        run: |
          echo "=== Validating Python Scripts ==="
          ERRORS=0
          for script in $(find .claude/skills -name "*.py" -type f); do
            if python -m py_compile "$script" 2>/dev/null; then
              echo "✅ $script"
            else
              echo "❌ $script — syntax error"
              ERRORS=$((ERRORS + 1))
            fi
          done
          echo ""
          if [ "$ERRORS" -gt 0 ]; then
            echo "❌ $ERRORS script(s) have syntax errors"
            exit 1
          else
            echo "✅ All scripts valid"
          fi

      - name: Validate shell scripts syntax
        run: |
          echo "=== Validating Shell Scripts ==="
          ERRORS=0
          for script in $(find .claude/skills -name "*.sh" -type f); do
            if bash -n "$script" 2>/dev/null; then
              echo "✅ $script"
            else
              echo "❌ $script — syntax error"
              ERRORS=$((ERRORS + 1))
            fi
          done
          echo ""
          if [ "$ERRORS" -gt 0 ]; then
            echo "❌ $ERRORS script(s) have syntax errors"
            exit 1
          else
            echo "✅ All scripts valid"
          fi

  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate README
        run: |
          if [ ! -f README.md ]; then
            echo "❌ README.md not found"
            exit 1
          fi
          echo "✅ README.md exists"

  notify:
    runs-on: ubuntu-latest
    needs: [lint, test, validate-skills, validate-scripts, docs]
    if: always()

    steps:
      - name: Check status
        run: |
          if [ "${{ needs.lint.result }}" == "failure" ] || \
             [ "${{ needs.test.result }}" == "failure" ] || \
             [ "${{ needs.validate-skills.result }}" == "failure" ] || \
             [ "${{ needs.validate-scripts.result }}" == "failure" ] || \
             [ "${{ needs.docs.result }}" == "failure" ]; then
            echo "❌ CI Pipeline Failed"
            exit 1
          else
            echo "✅ CI Pipeline Passed"
          fi
